<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{% block title %} Gists App {% endblock title%}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" , shrink-to-fit="no">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>

    <!--This is the navigation bar -->
    <div class="container">

      <!--This is the navigation bar header -->
      <header class="p-3 mb-3 border-bottom">

        <!--This is the navigation bar container -->
        <div class="container">

          <!--This is the navigation bar content -->
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
            <!--This is the newspaper brand link -->
            <a class="navbar-brand" href="{% url 'home' %}"> Gists </a>

            <!--This is the navigation links -->
            <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-8">
              {% if user.is_authenticated %}


            <!-- New Article Link -->
            <li>
              <a href="{% url 'article_create' %}" class="nav-link px-2 link-dark">
                <i class="fas fa-plus-circle"></i> New
              </a>
            </li>


            </ul>

            <!--This is the user dropdown -->
            <div class="dropdown text-end">

              <!--This is the user profile link -->
              <a href="#" class="d-block link-dark text-decoration-none dfropdown-toggle" id=" dropdownuser1" data-bs-toggle="dropdown" aria-expanded="false">
                {{user.username}}
              </a>

              <!--This is the user dropdown menu -->
              <ul class="dropdown-menu text-small" aria-labelledby="dropdownuser1">

                <!--This is the password change link -->
                <li>
                  <a class="dropdown-item" href="{% url 'password_change' %}">
                    Change Password
                  </a>
                </li>

                <!--This is the logout link -->
                <li>
                  <a class="dropdown-item" href="{% url 'logout'%}">
                    Logout
                  </a>
                </li>

              </ul>

            </div>

            {% else %}

            </ul>

            <!--This is the login and signup links -->
            <div class="text-end">

              <!--This is the login link -->
              <a href="{% url 'login' %}" class="btn btn-outline-primary me-2">Login</a>

              <!--This is the signup link -->
              <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
            </div>

            {% endif %}

          </div>

        </div>

      </header>

    </div>

    <!--This is the main content area -->
    <main>
      {% block content %} 
      {% endblock content %}
    </main>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  </body>

</html>
