{% extends 'base.html' %}

{% block title %} Delete Gist {% endblock title %}

{% block content %}

<!-- Delete Gist Form -->
<form method="post">
    {% csrf_token %}
    <p>Are you sure you want to delete this gist?</p>
    <button class="btn btn-danger ml-2" type="submit">Delete Gist</button>
    <a href="{% url 'gists_list' %}" class="btn btn-secondary">Cancel</a>

{% endblock content %}
